<!DOCTYPE html>
<!--
  The default theme is set on the html element below. The first script in the
  head switches it to the visitor's saved choice (see src/themes.ts).
  Don't write the head tag in angle brackets in a comment up here: Vite puts
  its own scripts after the first one it finds, comment or not.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>midishare</title>
    <!-- IBM Plex Sans for the interface, IBM Plex Mono for ABC text, counters and labels. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <!--
      Apply the theme the visitor chose last time, before anything is painted.
      The key and the theme ids mirror src/themes.ts; keep them in sync.
    -->
    <script>
      try {
        if (localStorage.getItem('midishare-theme') === 'daylight') {
          document.documentElement.setAttribute('data-theme', 'daylight')
        }
      } catch (e) {
        // Storage is blocked: stay on the default theme.
      }
    </script>
    <!--
      First-paint background, keyed to the data-theme attribute.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark theme. Each value mirrors --color-background
      of that theme in src/themes.css; keep them in sync.
    -->
    <style>
      html { background-color: #131210; color-scheme: dark; }
      html[data-theme="daylight"] { background-color: #dcdfe2; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
